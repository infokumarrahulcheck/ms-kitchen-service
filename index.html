    /* The original hamburger icon is part of the artwork; this transparent button makes it functional. */
    .menu-toggle{position:absolute;right:1.2%;top:1.2%;width:8.5%;height:7.5%;z-index:100;cursor:pointer;opacity:0}
    .menu-panel{display:none;position:fixed;right:24px;top:92px;width:300px;max-width:calc(100vw - 32px);z-index:1000;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.28);padding:10px;border:1px solid #e5e7eb;line-height:1.2}
    .menu-panel.open{display:block}
    .menu-panel a{display:block;padding:13px 14px;color:#061d34;text-decoration:none;font:700 15px/1.2 Arial,Helvetica,sans-serif;border-radius:8px}
    .menu-panel a:hover,.menu-panel a:focus{background:#f2f4f7}
    .menu-close{display:block;text-align:right;padding:5px 8px 8px;color:#777;font:700 13px/1 Arial,Helvetica,sans-serif;cursor:pointer}

    .page2{margin-top:0}

    .footer-links a{color:#555;text-decoration:none;margin:0 7px}

  <script>
    (function(){
      var toggle=document.getElementById('menu-toggle');
      var panel=document.getElementById('menu-panel');
      var close=panel.querySelector('.menu-close');
      function setOpen(open){ panel.classList.toggle('open',open); toggle.setAttribute('aria-expanded',open?'true':'false'); }
      toggle.addEventListener('click',function(e){ e.preventDefault(); setOpen(!panel.classList.contains('open')); });
      close.addEventListener('click',function(){ setOpen(false); });
      document.addEventListener('click',function(e){ if(panel.classList.contains('open') && !panel.contains(e.target) && e.target!==toggle){ setOpen(false); } });
      document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ setOpen(false); } });
    })();
  </script>
