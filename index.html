<head>

  <style>
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:#fff}
    body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;line-height:0}
    .page{width:100%;max-width:1024px;margin:0 auto}
    .image-wrap{position:relative;width:100%;max-width:1024px;margin:0 auto}
    .image-wrap>img{display:block;width:100%;height:auto;margin:0;padding:0;border:0}
    .hit{position:absolute;display:block;z-index:5;background:transparent;text-indent:-9999px;overflow:hidden}
    .hit:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
    .top-phone{left:55%;top:0.7%;width:28%;height:4.0%}
    .top-email{left:55%;top:4.0%;width:33%;height:3.5%}
    .hero-call{left:3.7%;top:28.6%;width:22.5%;height:4.2%}
    .hero-whatsapp{left:27.2%;top:28.6%;width:30%;height:4.2%}
    .review{left:5%;top:79.6%;width:44%;height:3.2%}
    .maps{left:53.5%;top:79.4%;width:42%;height:3.4%}
    .contact-call{left:57%;top:83.6%;width:39%;height:3.0%}
    .contact-whatsapp{left:57%;top:87.0%;width:39%;height:3.0%}
    .contact-email{left:57%;top:90.4%;width:39%;height:3.0%}

    /* Live visual effects — no slider, no change to existing links. */
    @keyframes pageFadeIn{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    @keyframes navDrop{0%{opacity:0;transform:translateY(-16px)}100%{opacity:1;transform:translateY(0)}}
    @keyframes shine{0%{transform:translateX(-130%) skewX(-18deg);opacity:0}18%{opacity:.65}48%{opacity:.65}68%{opacity:0}100%{transform:translateX(230%) skewX(-18deg);opacity:0}}
    @keyframes navGlow{0%,100%{text-shadow:none}50%{text-shadow:0 0 8px rgba(255,255,255,.65)}}
    @keyframes serviceGlow{0%,100%{opacity:0}50%{opacity:.28}}
    .image-wrap>img{animation:pageFadeIn .9s cubic-bezier(.2,.7,.2,1) both}
    .top-nav-wrap{animation:navDrop .7s cubic-bezier(.2,.7,.2,1) both}

    /* Make the transparent click areas visible only through animated effects. */
    .hit{overflow:visible}
    /* Soft shine only — no border/ring around the Call or WhatsApp buttons. */
    .hero-call,.hero-whatsapp{border-radius:999px;overflow:hidden}
    .hero-call::after,.hero-whatsapp::after{content:"";position:absolute;top:-15%;bottom:-15%;left:0;width:24%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);transform:translateX(-180%) skewX(-18deg);pointer-events:none;animation:shine 3.6s ease-in-out infinite}
    .hero-whatsapp::after{animation-delay:1.8s}
    .contact-call,.contact-whatsapp{overflow:hidden;border-radius:10px}
    .contact-call::after,.contact-whatsapp::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:22%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:translateX(-180%) skewX(-18deg);pointer-events:none;animation:shine 4s ease-in-out infinite}
    .contact-whatsapp::after{animation-delay:2s}
    .top-nav a{position:relative;transition:color .25s ease,transform .25s ease}
    .top-nav a:hover,.top-nav a:focus{color:#ffb000;text-decoration:none;transform:translateY(-1px)}
    .top-nav a:focus{outline:2px solid rgba(255,176,0,.75);outline-offset:-2px}
    .top-nav a:first-child{animation:navGlow 2.8s ease-in-out infinite}

    /* Gentle animated highlights over the four service cards. */
    .service-highlight{position:absolute;top:66.5%;height:10.5%;width:23%;pointer-events:none;z-index:3;border-radius:14px;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.8) 48%,transparent 72%);transform:translateX(-130%);animation:shine 6s ease-in-out infinite}
    .service-highlight.s1{left:1.5%;animation-delay:1.2s}.service-highlight.s2{left:26%;animation-delay:2.1s}.service-highlight.s3{left:50.5%;animation-delay:3s}.service-highlight.s4{left:75%;animation-delay:3.9s}

    /* Main navigation is now above the original image. */
    .top-nav-wrap{width:100%;max-width:1024px;margin:0 auto;background:#061d34;line-height:1}
    .top-nav{width:100%;display:flex;align-items:center;justify-content:center;overflow-x:auto;overflow-y:hidden;white-space:nowrap;padding:8px 6px}
    .top-nav a{flex:0 0 auto;color:#fff;text-decoration:none;font:700 14px/1 Arial,Helvetica,sans-serif;padding:7px 15px;border-right:1px solid rgba(255,255,255,.28)}
    .top-nav a:last-child{border-right:0}
    .top-nav a:hover,.top-nav a:focus{color:#ffb000;text-decoration:none}
    .page2{margin-top:0}
    .footer-links{max-width:1024px;margin:0 auto;padding:8px 12px 14px;font:12px/1.5 Arial,Helvetica,sans-serif;text-align:center;background:#fff}
    .footer-links a{color:#555;text-decoration:none;margin:0 7px}
    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      .image-wrap>img,.top-nav-wrap,.hero-call::after,.hero-whatsapp::after,.contact-call::after,.contact-whatsapp::after,.top-nav a:first-child,.service-highlight{animation:none}
    }
    @media (max-width:600px){
      html,body,main{width:100%;max-width:100%;min-width:0;overflow-x:hidden}
      .top-nav-wrap,.page,.image-wrap,.page2{width:100vw;max-width:100vw;margin-left:0;margin-right:0}
      .top-nav{width:100%;justify-content:flex-start;padding:6px 4px}
      .top-nav a{font-size:11px;padding:7px 10px}
      .image-wrap>img,.page2 img{width:100%;max-width:100%;height:auto}
    }
    @media (min-width:1025px){body{background:#f2f4f7}.page{box-shadow:0 0 0 1px #e6e6e6}.top-nav-wrap{box-shadow:0 1px 4px rgba(0,0,0,.12)}}
  </style>
</head>
